name: Cypress Tests

on: [push]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping:1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install server dependencies
        run: |
          cd electronic-store-mern/server
          npm ci
      - name: Seed backend database
        run: |
          cd electronic-store-mern/server
          # point at the Mongo service container
          MONGO_URI=mongodb://localhost:27017/electrostore npm run seed
      - name: Start backend server
        run: |
          cd electronic-store-mern/server
          MONGO_URI=mongodb://localhost:27017/electrostore npm run dev &
          until curl -s http://localhost:5000/api/health >/dev/null 2>&1; do
            sleep 1
          done
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: electronic-store-mern/client
          start: npm run dev
          wait-on: 'http://localhost:5173'
          record: false   # disable recording since projectId isn't configured
          parallel: false  # no parallel, avoid CI flags when record is false
          args: --config video=false,screenshotOnRunFailure=true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots
      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: client/cypress/videos
