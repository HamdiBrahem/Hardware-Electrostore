name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping:1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js for server
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electronic-store-mern/server/package-lock.json

      - name: Set up Node.js for client
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electronic-store-mern/client/package-lock.json

      - name: Run server tests
        working-directory: electronic-store-mern/server
        run: |
          npm ci
          npm test

      - name: Run client tests
        working-directory: electronic-store-mern/client
        run: |
          npm ci
          npm test

      # ─── End-to-end tests using Cypress ───────────────────────
      - name: Run Cypress e2e tests
        uses: cypress-io/github-action@v5
        with:
          working-directory: electronic-store-mern/client
          start: |
            cd ../server
            npm ci
            export MONGO_URI=mongodb://localhost:27017/electrostore_test
            npm run start &
            cd ../client
            npm ci
            export VITE_API_URL=http://localhost:5000
            npm run dev -- --host
          wait-on: "http://localhost:5000, http://localhost:5173"
          wait-on-timeout: 60
          browser: chrome
          command: npm run cy:run
