name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping:1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js for server
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electronic-store-mern/server/package-lock.json

      - name: Set up Node.js for client
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electronic-store-mern/client/package-lock.json

      - name: Run server tests
        working-directory: electronic-store-mern/server
        run: |
          npm ci
          npm test

      - name: Run client tests
        working-directory: electronic-store-mern/client
        run: |
          npm ci
          npm test

      # ─── End-to-end tests using Cypress ───────────────────────
      - name: Cache Cypress binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/cypress.config.js') }}

      - name: Run Cypress e2e tests
        run: |
          # install deps for both sides (server may not have been installed since earlier job)
          cd electronic-store-mern/server
          npm ci
          MONGO_URI=mongodb://localhost:27017/electrostore_test npm run start &
          cd ../client
          npm ci
          # start vite listening on all interfaces so wait-on can detect it
          VITE_API_URL=http://localhost:5000 npm run dev -- --host &
          echo "waiting for backend & frontend"
          npx wait-on http://localhost:5000
          npx wait-on http://localhost:5173
          npm run cy:run
