name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping:1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js for server
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electronic-store-mern/server/package-lock.json

      - name: Set up Node.js for client
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electronic-store-mern/client/package-lock.json

      - name: Run server tests
        working-directory: electronic-store-mern/server
        run: |
          npm ci
          npm test

      - name: Run client tests
        working-directory: electronic-store-mern/client
        run: |
          npm ci
          npm test

      # Upload test coverage reports for server and client
      - name: Generate server coverage
        working-directory: electronic-store-mern/server
        run: |
          npm run test:coverage
      - name: Upload server coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: server-coverage
          path: electronic-store-mern/server/coverage

      - name: Generate client coverage
        working-directory: electronic-store-mern/client
        run: |
          npm run test:coverage
      - name: Upload client coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: client-coverage
          path: electronic-store-mern/client/coverage
