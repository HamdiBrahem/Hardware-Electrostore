name: Automated API tests using Postman CLI

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping:1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Install server dependencies
        run: |
          cd electronic-store-mern/server
          npm ci
      - name: Seed database
        run: |
          cd electronic-store-mern/server
          # seed with known products (includes fixed _id used by Postman tests)
          MONGO_URI=mongodb://localhost:27017/electrostore npm run seed
      - name: Start server
        run: |
          cd electronic-store-mern/server
          # provide a MongoDB connection string that points at the service container
          MONGO_URI=mongodb://localhost:27017/electrostore npm run dev &
          # wait until the health endpoint responds before running tests
          until curl -s http://localhost:5000/api/health >/dev/null 2>&1; do
            sleep 1
          done
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run "34675708-6d3fa8f6-9b5f-408b-b07a-ba2c8236639f" -e "34675708-c9452588-8548-47c1-90e6-1a87be4b2b9b"